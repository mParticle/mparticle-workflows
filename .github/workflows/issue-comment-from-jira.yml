# This is a workflow add a comment on a GitHub issue

name: Add Github Comment

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      jira_ticket:
        type: string
        description: Jira ticket number
        required: true
      comment:
        type: string
        description: Jira ticket status
        required: true
  repository_dispatch:

permissions: {}

jobs:
  add-issue-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Login
        uses: atlassian/gajira-login@ca13f8850ea309cf44a6e4e0c49d9aa48ac3ca4c # v3

      - name: Get Jira Ticket Links
        uses: fjogeleit/http-request-action@f98bb26551cd1af7d3eb2674578a80754ece88db # v2.0.1
        id: get_links
        with:
          url: ${{ env.JIRA_BASE_URL }}/rest/api/2/issue/${{ github.event.inputs.jira_ticket }}/remotelink
          method: GET
          username: ${{ env.JIRA_USER_EMAIL }}
          password: ${{ env.JIRA_API_TOKEN }}
          customHeaders: '{"Content-Type": "application/json"}'

      - env:
          LINKS_RESPONSE: ${{ steps.get_links.outputs.response }}
        run: echo "$LINKS_RESPONSE"

      - name: Parse URL from List
        id: parse_url
        env:
          LINKS_RESPONSE: ${{ steps.get_links.outputs.response }}
        run: |
          issue_url=$(printf '%s' "$LINKS_RESPONSE" | jq -r '.[] | select(.object.title | startswith("Github Issue Link:")).object.url')
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"

      - uses: mad9000/actions-find-and-replace-string@bf97a127285f67d542d3f06145424c64803ae81a # 2
        id: sub
        with:
          source: '${{ steps.parse_url.outputs.issue_url }}'
          find: github.com
          replace: api.github.com/repos

      - env:
          API_ISSUE_URL: ${{ steps.sub.outputs.value }}
        run: echo "$API_ISSUE_URL"

      - name: Add Comment
        env:
          BOT_TOKEN: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}
          API_ISSUE_URL: ${{ steps.sub.outputs.value }}
          COMMENT_TEXT: ${{ github.event.inputs.comment }}
        run: |
          payload=$(jq -n --arg body "$COMMENT_TEXT" '{"body": $body}')
          curl \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $BOT_TOKEN" \
          "${API_ISSUE_URL}/comments" \
          -d "$payload"
