name: Web Test Runner

on:
    workflow_call:
        inputs:
            # Maybe nees node version for matrix?
            test_command:
                description: 'Enter the NPM command that will run a test'
                type: string
            test_command_label:
                description: 'Enter the Name of this test (for debugging)'
                type: string
            build_command:
                description: 'Enter the NPM command that will build files'
                type: string
            branch_name:
                description: 'branch name to run tests on'
                type: string

permissions:
    contents: read

jobs:
    run_test:
        name: ${{ inputs.test_command_label }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ inputs.branch_name }}

            - name: NPM install
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x

            - name: Run NPM CI
              run: npm ci

            - name: Run Build
              env:
                  BUILD_COMMAND: ${{ inputs.build_command }}
              run: eval "$BUILD_COMMAND"

            - name: Install Firefox Latest
              uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2

            - name: Log Firefox Version
              run: firefox --version

            - name: Run ${{ inputs.test_command_label }}
              env:
                  TEST_COMMAND: ${{ inputs.test_command }}
              run: eval "$TEST_COMMAND"

            - name: Archive npm failure logs
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs
