name: Respond and Close Issue

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      repository:
        required: true
        type: string
      user_login:
        description: Github Login for User who opened the issue.
        required: true
        type: string

permissions: {}

jobs:
  respond_and_close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_NAME: ${{ inputs.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      USER_LOGIN: ${{ github.event.issue.user.login }}
    steps:
      - name: Add a comment
        run: |
          body=$(jq -n --arg u "$USER_LOGIN" '{"body": ("Thank you for opening this issue, @" + $u + "!  In order to get you the fastest response to your issue, you should instead open a ticket at http://support.mparticle.com. This issue will now be automatically closed.")}')
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO_NAME}/issues/${ISSUE_NUMBER}/comments" \
            -d "$body"
      - name: Close the issue
        run: |
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO_NAME}/issues/${ISSUE_NUMBER}" \
            -d '{"state": "closed"}'
