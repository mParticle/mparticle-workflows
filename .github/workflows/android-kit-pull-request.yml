name: "Android Kit Pull Request Checks"

on:
  workflow_call:
    inputs:
      dryRun:
        description: "Do a dry run to preview instead of a real release [true/false]"
        required: false
        default: "true"
        type: string
      branch_name:
        description: "branch name to run tests on"
        required: false
        default: "development"
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-branch-check-name:
    name: "Check PR for semantic branch name"
    uses: ./.github/workflows/pr-branch-check-name.yml # zizmor: ignore[self-repository]

  pr-title-check:
    name: "Check PR for semantic title"
    uses: ./.github/workflows/pr-title-check.yml # zizmor: ignore[self-repository]

  regression-checks:
    name: "Run regression"
    uses: ./.github/workflows/android-kit-push.yml # zizmor: ignore[self-repository]
    with:
      dryRun: ${{ inputs.dryRun }}
      branch_name: ${{ github.head_ref }}

  automerge-dependabot:
    name: "Save PR Number for Dependabot Automerge"
    needs: [ regression-checks ]
    permissions:
      contents: read
    uses: ./.github/workflows/dependabot-save-pr-number.yml # zizmor: ignore[self-repository]
