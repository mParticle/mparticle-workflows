name: Fetch Data Plan

on:
    workflow_call:
      inputs:
        app_relative_path:
          description: 'repo path for sample app'
          required: true
          type: string
        data_plan_id:
          description: Data Plan ID
          required: true
          type: string
        data_plan_version:
          description: Data Plan Version Number
          required: true
          type: string
      secrets:
        WORKSPACE_ID:
          description: MP Dashboard Workspace ID
          required: true
        CLIENT_ID:
          description: Client ID
          required: true
        CLIENT_SECRET:
          description: Client Secret
          required: true

permissions:
  contents: read

jobs:
  fetch-data-plan:
    name: "Fetch Data Plan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install mP CLI
        # Reusable workflow runs in caller repositories that do not commit a lockfile for @mparticle/cli.
        run: npm install -g @mparticle/cli # zizmor: ignore[adhoc-packages]

      - name: Fetch Data Plans with mp CLI
        id: fetch-data-plans
        env:
          WORKSPACE_ID: ${{ secrets.WORKSPACE_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DATA_PLAN_ID: ${{ inputs.data_plan_id }}
          DATA_PLAN_VERSION: ${{ inputs.data_plan_version }}
        working-directory: ${{ inputs.app_relative_path }}
        run: |
          mp planning:data-plan-versions:fetch --dataPlanId=higgs_shop_basic_data_plan --versionNumber="$DATA_PLAN_VERSION" --outFile="dataplans/${DATA_PLAN_ID}_${DATA_PLAN_VERSION}.json" --workspaceId="$WORKSPACE_ID" --clientId="$CLIENT_ID" --clientSecret="$CLIENT_SECRET"

      - name: Archive Data Plan Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: higgs-shop-dataplan
          path: ${{ inputs.app_relative_path }}/dataplans/
