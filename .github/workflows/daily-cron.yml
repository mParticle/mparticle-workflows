name: Daily Cron

on:
  # Run daily at midnight
  schedule:
    - cron: "0 0 * * *"

  # Allow to be called from a workflow child
  workflow_call:

  # Allow workflow to be manually run from the GitHub UI
  workflow_dispatch:

permissions: {}

jobs:
  cleanup_old_branches:
    runs-on: ubuntu-latest
    name: "Clean up old branches"
    permissions: {}
    steps:
      - name: "Delete stale branches"
        uses: phpdocker-io/github-actions-delete-abandoned-branches@e04764c2f0f714dedb80c42d5174e756568a0452 # v2.0.3
        id: delete
        with:
          github_token: ${{ secrets.MP_DAILY_CRON_BOT }}
          last_commit_age_days: 30

          # Disable dry run and actually get stuff deleted
          dry_run: no

      - name: Get output
        env:
          DELETED_BRANCHES: ${{ steps.delete.outputs.deleted_branches }}
        run: |
          echo "Deleted branches: $DELETED_BRANCHES"

  run-semgrep-full:
    name: "Run Semgrep over entire repo"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Shared Semgrep container image maintained upstream; pinned tag not fixed across callers.
      image: returntocorp/semgrep # zizmor: ignore[unpinned-images]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run Semgrep"
        run: "semgrep --config=auto ."

  regression-check:
    name: "Run regression"
    if: contains(github.repository, 'android')
    permissions:
      contents: read
    uses: ./.github/workflows/android-kit-push.yml # zizmor: ignore[self-repository]
    with:
      dryRun: "true"
      branch_name: "development"
