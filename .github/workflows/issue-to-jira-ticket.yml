name: Create Jira Issue

on:
  workflow_call:
  issues:
    types: ["opened"]

permissions: {}

jobs:
  create-issue:
    name: "Create Issue"
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: "Login"
        uses: atlassian/gajira-login@ca13f8850ea309cf44a6e4e0c49d9aa48ac3ca4c # v3

      - name: "Create"
        id: create
        uses: atlassian/gajira-create@1ff0b6bd115a780592b47bfbb63fc4629132e6ec # v3
        with:
          project: "SQDSDKS"
          issuetype: "Story"
          summary: |
            ${{ github.event.issue.title }}
          description: |
            ${{ github.event.issue.body }}
          fields: '{"parent": { "key": "SQDSDKS-4555" }}'

      - name: "Create First Comment"
        uses: atlassian/gajira-comment@76589d6b6d0b94b1ca6b01171c01a6affb5d6701 # v3
        with:
          issue: ${{ steps.create.outputs.issue }}
          comment: "GitHub Issue: ${{ github.event.issue.html_url }}"

      - name: Link Jira Issue
        env:
          ISSUE_HTML_URL: ${{ github.event.issue.html_url }}
          REPO_FULL_NAME: ${{ github.event.repository.full_name }}
          JIRA_ISSUE_KEY: ${{ steps.create.outputs.issue }}
        run: |
          payload=$(jq -n --arg url "$ISSUE_HTML_URL" --arg repo "$REPO_FULL_NAME" '{"object": {"url": $url, "title": ("Github Issue Link: " + $repo)}}')
          curl -k -D- -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" -X POST -H 'Content-Type: application/json' -d "$payload" \
          "${JIRA_BASE_URL}/rest/api/2/issue/${JIRA_ISSUE_KEY}/remotelink"

      - name: "Log created issue"
        env:
          JIRA_ISSUE_KEY: ${{ steps.create.outputs.issue }}
        run: echo "Issue $JIRA_ISSUE_KEY was created"

      - name: "Create Github comment"
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Tracked internally as ${{ steps.create.outputs.issue }} was created
          reactions: '+1'

      - name: Create and add label
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_ISSUE_KEY: ${{ steps.create.outputs.issue }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create "$JIRA_ISSUE_KEY" --repo "$GITHUB_REPOSITORY" --color 0095b3 --description "$JIRA_ISSUE_KEY" --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$JIRA_ISSUE_KEY"
