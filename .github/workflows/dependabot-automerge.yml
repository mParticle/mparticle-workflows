name: "Dependabot Automerge"

on:
  workflow_call:

permissions: {}

jobs:
  automerge-dependabot:
    name: "Automerge Dependabot PR"
    if: >
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_run') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}
      GIT_AUTHOR_NAME: mparticle-automation
      GIT_AUTHOR_EMAIL: developers@mparticle.com
      GIT_COMMITTER_NAME: mparticle-automation
      GIT_COMMITTER_EMAIL: developers@mparticle.com
    runs-on: ubuntu-latest
    steps:
      - name: 'Print Event'
        env:
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          echo "$WORKFLOW_RUN_EVENT"
      - name: 'Download artifact'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKSPACE: ${{ github.workspace }}
        with:
          script: |
            var artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: Number(process.env.WORKFLOW_RUN_ID),
            });
            var matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "pr"
            })[0];
            var download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            var fs = require('fs');
            fs.writeFileSync(`${process.env.WORKSPACE}/pr.zip`, Buffer.from(download.data));
      - run: unzip pr.zip
      - name: 'Automerge PR'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            var fs = require('fs');
            var issue_number = Number(fs.readFileSync('./NR'));
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
              merge_method: 'squash'
            });
