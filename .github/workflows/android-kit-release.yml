name: "Android Kit Release SDK"

on:
  workflow_call:
    inputs:
      dryRun:
        description: "Do a dry run to preview instead of a real release [true/false]"
        required: false
        default: "false"
        type: string

permissions: {}

jobs:
  # SDK release is done from public main branch.
  confirm-public-repo-main-branch:
    name: "Confirm release is run from public/main branch"
    permissions:
      contents: read
    uses: ./.github/workflows/sdk-release-repo-branch-check.yml # zizmor: ignore[self-repository]

  create-release-branch:
    name: "Create Release Branch"
    runs-on: ubuntu-latest
    needs: confirm-public-repo-main-branch
    permissions: {}
    env:
      GITHUB_TOKEN: ${{ secrets.MP_INTEGRATIONS_SEMANTIC_RELEASE_BOT }}
      GIT_AUTHOR_NAME: mparticle-automation
      GIT_AUTHOR_EMAIL: developers@mparticle.com
      GIT_COMMITTER_NAME: mparticle-automation
      GIT_COMMITTER_EMAIL: developers@mparticle.com
    steps:
      - name: "Checkout main branch" # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.MP_INTEGRATIONS_SEMANTIC_RELEASE_BOT }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: main
      - name: "Import GPG Key"
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: "Create and push release branch"
        run: |
          git checkout -b release/${{ github.run_number }}
          git push origin release/${{ github.run_number }}

  regression-check:
    needs: create-release-branch
    name: "Run regression"
    permissions:
      contents: read
    uses: ./.github/workflows/android-kit-push.yml # zizmor: ignore[self-repository]
    with:
      dryRun: ${{ inputs.dryRun }}
      branch_name: release/${{ github.run_number }}

  sync-repository:
    name: "Sync Repository"
    needs: regression-check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: "Checkout main branch" # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: ${{ github.repository }}
          token: ${{ secrets.MP_INTEGRATIONS_SEMANTIC_RELEASE_BOT }}
          ref: main
      - name: "Merge release branch into main branch"
        if: ${{ inputs.dryRun == 'false' }}
        run: |
          git pull origin release/${{ github.run_number }}
      - name: "Push release commits to main branch"
        if: ${{ inputs.dryRun == 'false' }}
        run: |
          git push origin HEAD:main
      - name: "Delete release branch"
        if: ${{ inputs.dryRun == 'false' }}
        run: |
          git push --delete origin release/${{ github.run_number }}
